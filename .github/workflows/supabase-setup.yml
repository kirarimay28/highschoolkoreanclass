# Supabase 자동 설정 (수동 실행)
# 필요한 비밀값: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens)
# 하는 일: ① DB 만들기(supabase/schema.sql) ② 로그인 설정 ③ 선생님 초대 메일 발송
#          ④ 앱에 연결(.env.production 커밋 → Vercel 자동 배포)
name: Supabase setup

on:
  workflow_dispatch:
    inputs:
      teacher_email:
        description: 초대할 선생님 이메일 (비워 두면 건너뜀)
        required: false
      teacher_name:
        description: 화면에 보일 선생님 이름
        required: false
      project_name:
        description: Supabase 프로젝트 이름
        default: highschoolkoreanclass
      site_url:
        description: 앱 주소
        default: https://highschoolkoreanclass.vercel.app

permissions:
  contents: write

concurrency:
  group: supabase-setup

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      API: https://api.supabase.com/v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 프로젝트 찾기
        id: project
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN 비밀값이 없습니다."; exit 1; fi
          projects=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$API/projects")
          ref=$(echo "$projects" | jq -r --arg n "$PROJECT_NAME" '[.[] | select(.name == $n)][0].id // empty')
          if [ -z "$ref" ]; then
            echo "::error::'$PROJECT_NAME' 프로젝트를 찾지 못했습니다. 있는 프로젝트: $(echo "$projects" | jq -r '[.[].name] | join(", ")')"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "프로젝트: $PROJECT_NAME ($ref)"

      - name: 데이터베이스 만들기 (schema.sql)
        env:
          REF: ${{ steps.project.outputs.ref }}
        run: |
          set -euo pipefail
          body=$(jq -Rs '{query: .}' supabase/schema.sql)
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d "$body" "$API/projects/$REF/database/query")
          if [ "$code" -ge 300 ]; then echo "::error::DB 설정 실패 ($code): $(cat out.json)"; exit 1; fi
          echo "DB 설정 완료"

      - name: 키 가져오기
        id: keys
        env:
          REF: ${{ steps.project.outputs.ref }}
        run: |
          set -euo pipefail
          keys=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$API/projects/$REF/api-keys?reveal=true")
          anon=$(echo "$keys" | jq -r '[.[] | select(.name == "anon")][0].api_key // empty')
          service=$(echo "$keys" | jq -r '[.[] | select(.name == "service_role")][0].api_key // empty')
          if [ -z "$anon" ] || [ -z "$service" ]; then echo "::error::API 키를 가져오지 못했습니다."; exit 1; fi
          echo "::add-mask::$service"
          echo "anon=$anon" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"

      - name: 로그인 설정 (앱 주소, 아무나 가입 금지)
        env:
          REF: ${{ steps.project.outputs.ref }}
          SITE: ${{ inputs.site_url }}
        run: |
          set -euo pipefail
          body=$(jq -n --arg s "$SITE" '{site_url: $s, uri_allow_list: ($s + "/**"), disable_signup: true}')
          curl -fsS -o /dev/null -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "$body" "$API/projects/$REF/config/auth"
          echo "로그인 설정 완료"

      - name: 선생님 초대
        if: ${{ inputs.teacher_email != '' }}
        env:
          REF: ${{ steps.project.outputs.ref }}
          SERVICE: ${{ steps.keys.outputs.service }}
          EMAIL: ${{ inputs.teacher_email }}
          NAME: ${{ inputs.teacher_name }}
          SITE: ${{ inputs.site_url }}
        run: |
          set -euo pipefail
          auth="https://$REF.supabase.co/auth/v1"
          body=$(jq -n --arg e "$EMAIL" '{email: $e}')
          code=$(curl -sS -o invite.json -w '%{http_code}' -X POST "$auth/invite?redirect_to=$SITE" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" -H 'Content-Type: application/json' -d "$body")
          if [ "$code" -ge 300 ]; then
            echo "이미 있는 계정일 수 있어 그대로 진행합니다 ($code)"
          else
            echo "초대 메일을 보냈습니다"
          fi
          name="${NAME:-선생님}"
          q="select public.add_teacher('${EMAIL//\'/\'\'}', '${name//\'/\'\'}');"
          sql=$(jq -n --arg q "$q" '{query: $q}')
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d "$sql" "$API/projects/$REF/database/query")
          if [ "$code" -ge 300 ]; then echo "::error::선생님 등록 실패 ($code): $(cat out.json)"; exit 1; fi
          echo "선생님 등록 완료"

      - name: 앱에 연결 (.env.production)
        env:
          REF: ${{ steps.project.outputs.ref }}
          ANON: ${{ steps.keys.outputs.anon }}
        run: |
          set -euo pipefail
          printf 'VITE_SUPABASE_URL=https://%s.supabase.co\nVITE_SUPABASE_ANON_KEY=%s\n' "$REF" "$ANON" > .env.production
          if git diff --quiet -- .env.production 2>/dev/null && git ls-files --error-unmatch .env.production >/dev/null 2>&1; then
            echo "이미 연결되어 있습니다"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.production
          git commit -m "Supabase 연결 (.env.production)"
          git push origin HEAD:main
          echo "연결 완료 — Vercel 이 곧 다시 배포합니다"
